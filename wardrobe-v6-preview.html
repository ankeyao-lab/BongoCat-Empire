<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    敲敲猫 1.8 · 实际组件试装
  </title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f4f1e9;
      color: #39353e;
      font:
        15px/1.6 -apple-system,
        sans-serif;
    }
    main {
      max-width: 1040px;
      margin: auto;
      padding: 32px;
    }
    h1 {
      font-size: 27px;
    }
    p {
      color: #766b79;
    }
    .controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    select {
      font: inherit;
      padding: 5px;
    }
    #pet {
      width: 400px;
      height: 379px;
      margin: auto;
    }
    .mat {
      padding: 30px;
      background: repeating-conic-gradient(#e5e4e3 0% 25%, #f7f6f4 0% 50%) 0/20px 20px;
      border-radius: 14px;
    }
    .controls label {
      white-space: nowrap;
    }
    .hint {
      font-size: 13px;
    }
  </style>
  <main>
    <h1>敲敲猫 1.8 · 动态袖口与全主题</h1>
    <p>实际运行组件预览；移动指针、敲键盘、点击和滚动可查看反馈。此页不记录成长。</p>
    <div class="controls">
      <label
        >主题
        <select id="theme"></select></label
      ><label
        >等级
        <select id="level"></select></label
      ><label
        >模式
        <select id="mode">
          <option value="trackpad">触摸板</option>
          <option value="standard">鼠标</option>
          <option value="keyboard">方向键</option>
          <option value="gamepad">手柄</option>
        </select></label
      ><label><input id="mirror" type="checkbox" />整猫镜像</label
      ><label><input id="pointerMirror" type="checkbox" />额外水平反转</label
      ><label><input id="dark" type="checkbox" />深色底</label>
    </div>
    <div class="mat"><div id="pet"></div></div>
    <p class="hint">
      默认猫视角：指针右上对应触摸板画面最左角。手臂根部固定在衣服袖口；键字、蓝光和眼睛均为独立原始层。
    </p>
  </main>
  <script type="module">
    import { createApp, h, reactive, nextTick } from '/node_modules/.vite/deps/vue.js'
    import Pet from '/src/components/wizard-pet/WizardPet.vue'
    import { playfulThemes } from '/src/components/wizard-pet/playful-art.ts'
    const props = reactive({
      outfitThemeId: 'wizard',
      level: 1,
      mode: 'trackpad',
      mirror: false,
      pointerMirror: false,
      blinkEyes: true,
      reducedMotion: true,
      showProgress: true,
      progress: 0.42,
    })
    const input = reactive({
      leftTap: false,
      rightTap: false,
      rightMode: 'keyboard',
      pointer: { x: 0, y: 0 },
      pressedKeys: [],
      pressedButtons: [],
      mouseButtons: [],
      scrolling: false,
      scrollDirection: 1,
      sticks: { left: { x: 0, y: 0 }, right: { x: 0, y: 0 } },
    })
    window.qa = { props, input, tick: nextTick }
    createApp({ render: () => h(Pet, { ...props, input }) }).mount('#pet')
    for (const t of playfulThemes) document.querySelector('#theme').add(new Option(t.name, t.id))
    for (let l = 1; l <= 9; l++) document.querySelector('#level').add(new Option('Lv' + l, l))
    document.querySelector('#theme').onchange = (e) => (props.outfitThemeId = e.target.value)
    document.querySelector('#level').onchange = (e) => (props.level = Number(e.target.value))
    document.querySelector('#mode').onchange = (e) => {
      props.mode = e.target.value
      input.pressedKeys = []
      input.pressedButtons = []
    }
    for (const k of ['mirror', 'pointerMirror'])
      document.querySelector('#' + k).onchange = (e) => (props[k] = e.target.checked)
    document.querySelector('#dark').onchange = (e) =>
      (document.querySelector('.mat').style.background = e.target.checked ? '#282b32' : '')
    let idleTimer
    function pointerActivity() {
      input.rightMode = 'trackpad'
      clearTimeout(idleTimer)
      idleTimer = setTimeout(() => {
        if (!input.mouseButtons.length) input.rightMode = 'keyboard'
      }, 600)
    }
    addEventListener('pointermove', (e) => {
      input.pointer = { x: (e.clientX / innerWidth) * 2 - 1, y: (e.clientY / innerHeight) * 2 - 1 }
      pointerActivity()
    })
    addEventListener('keydown', (e) => {
      if (e.target.matches('input,select,textarea')) return
      if (e.code === 'Space') e.preventDefault()
      if (!input.pressedKeys.includes(e.code)) input.pressedKeys.push(e.code)
    })
    addEventListener('keyup', (e) => (input.pressedKeys = input.pressedKeys.filter((k) => k !== e.code)))
    addEventListener('pointerdown', () => {
      input.mouseButtons = ['Left']
      input.rightTap = true
      pointerActivity()
    })
    addEventListener('pointerup', () => {
      input.mouseButtons = []
      input.rightTap = false
      pointerActivity()
    })
    let timer
    addEventListener(
      'wheel',
      (e) => {
        pointerActivity()
        input.scrolling = true
        input.scrollDirection = e.deltaY < 0 ? 1 : -1
        clearTimeout(timer)
        timer = setTimeout(() => (input.scrolling = false), 300)
      },
      { passive: true },
    )
    addEventListener('blur', () => {
      input.pressedKeys = []
      input.pressedButtons = []
      input.mouseButtons = []
      input.rightTap = false
      pointerActivity()
    })
  </script>
</html>
